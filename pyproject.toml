[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-digital-lab"
version = "0.1.0"
description = "Laboratório Python local do projeto Eu Digital"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.uv]
package = true
