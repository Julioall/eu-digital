name: Hybrid Foundation Validation

on:
  pull_request:
  push:
    branches:
      - main
      - "spec/**"

permissions:
  contents: read

jobs:
  hybrid:
    name: Python laboratory and C++ runtime
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install locked Python package
        run: uv sync --locked

      - name: Run hybrid validation
        run: uv run python tools/validate_hybrid.py

      - name: Validate shared contracts
        run: uv run python tools/validate_contracts.py
