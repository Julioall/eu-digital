name: Hybrid Foundation Validation

on:
  pull_request:
  push:
    branches:
      - main
      - "spec/**"

permissions:
  contents: read

jobs:
  hybrid:
    name: Python laboratory and C++ runtime
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install SQLite runtime for timeline store
        shell: pwsh
        run: |
          vcpkg install sqlite3:x64-windows
          $vcpkgPrefix = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows"
          "$vcpkgPrefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$vcpkgPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install locked Python package
        run: uv sync --locked

      - name: Run hybrid validation
        run: uv run python tools/validate_hybrid.py

      - name: Validate shared contracts
        run: uv run python tools/validate_contracts.py

      - name: Enforce approved promotion gate
        run: uv run python tools/check_promotions.py
